[project]
name = "stock-alpha-model"
version = "0.1.0"
description = "A-share short-term alpha model: V1 daily, V2 intraday, V4 level2 abstraction framework"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "joblib>=1.4",
]

[project.optional-dependencies]
data = ["akshare", "baostock"]
ml = ["scikit-learn", "lightgbm"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
